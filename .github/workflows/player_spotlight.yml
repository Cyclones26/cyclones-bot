# Player Spotlight -- cron fires every Tuesday, but the script itself only
# posts every OTHER Tuesday (see config.SPOTLIGHT_MIN_DAYS_BETWEEN and
# player_spotlight.py's cadence check). Offset to 15:00 UTC so it doesn't
# collide with player_tracker.yml's Thursday 14:00 UTC run over shared
# API rate limits.
#
# SETUP: same one-time steps as the other workflows -- see
# roster_alerts.yml's header comment. This job commits spotlight_state.json
# back to the repo instead of state.json / tracked_players.json.
#
# Before this ever posts anything, add rows to the "Player Bios" tab in
# the sheet (Person ID | Name | High School | Draft / Signed Info |
# Signed Date | Fun Fact) -- the tab is created automatically with headers
# on the first run if it doesn't exist yet, but stays empty until you fill
# it in by hand. Person ID is the same MLB personId shown in the
# auto-synced "Tracked Players" tab.

name: Player Spotlight

on:
  schedule:
    - cron: "0 15 * * 2"   # Tuesdays at 15:00 UTC
  workflow_dispatch: {}

jobs:
  player-spotlight:
    runs-on: ubuntu-latest
    concurrency: cyclones-bot-spotlight-state
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run player spotlight
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          MLB_TEAM_ID: "453"
          MLB_SEASON: "2026"
        run: python player_spotlight.py

      - name: Commit updated spotlight_state.json
        run: |
          git config user.name "cyclones-bot"
          git config user.email "actions@users.noreply.github.com"
          git add spotlight_state.json
          git diff --cached --quiet || git commit -m "chore: update player-spotlight state [skip ci]"
          git push
